project:
  type: website
  output-dir: _site
  # Explicit allowlist: only these are rendered and published. Without it, any
  # stray .md/.qmd dropped in the repo root gets built into the public site.
  render:
    - index.qmd
    - about.qmd
    - posts/

website:
  description: "A blog built with Quarto"
  site-url: https://jim-bo.github.io/rmrfcancer/
  title: "rm -rf /cancer"
  navbar:
    right:
      - about.qmd
      - icon: github
        href: https://github.com/jim-bo
      - icon: twitter
        href: https://x.com/jim_bo_
format:
  html:
    theme:
      - litera
      - brand
    css: styles.css
    mainfont: "Merriweather"
    monofont: "Fira Code"
    fontsize: 1.1em
    linestretch: 1.7
